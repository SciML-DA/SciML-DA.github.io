<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <strong>{{ site.Params.shortTitle }}</strong><br>
      <span class="muted">{{ site.Params.institution }}</span>
    </div>
    <div class="footer-links">
      <a href="mailto:{{ site.Params.email }}">Email</a>
      <a href="{{ site.Params.scholar }}">Scholar</a>
      <a href="{{ site.Params.github }}">GitHub</a>
      <a href="{{ site.Params.orcid }}">ORCID</a>
      <a href="{{ site.Params.personalSite }}">PI homepage</a>
    </div>
    {{- with site.Params.goatCounterCode }}
    <div class="footer-links" style="display:inline-flex;align-items:center;gap:0.3em;font-size:inherit;line-height:inherit;">
      <span aria-hidden="true">🔢</span>
      <span id="goatcounter-visits"></span>
    </div>
    <script data-goatcounter="https://{{ . }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script>
        var goatcounterPoll = setInterval(function () {
            if (window.goatcounter && window.goatcounter.visit_count) {
                clearInterval(goatcounterPoll)
                window.goatcounter.visit_count({ append: '#goatcounter-visits' })
            }
        }, 100)
    </script>
    <style>
        #goatcounter-visits img,
        #goatcounter-visits svg { display: none !important; }
        #goatcounter-visits, #goatcounter-visits * {
            font-size: inherit !important;
            line-height: inherit !important;
        }
    </style>
    {{- end }}
  </div>
</footer>

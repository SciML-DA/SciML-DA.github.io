<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <strong>{{ site.Params.shortTitle }}</strong><br>
      <span class="muted">{{ site.Params.institution }}</span>
    </div>
    <div class="footer-links">
      <a href="mailto:{{ site.Params.email }}">Email</a>
      <a href="{{ site.Params.scholar }}">Scholar</a>
      <a href="{{ site.Params.github }}">GitHub</a>
      <a href="{{ site.Params.orcid }}">ORCID</a>
      <a href="{{ site.Params.personalSite }}">PI homepage</a>
    </div>
    {{- with site.Params.goatCounterCode }}
    <div class="footer-links">
      <a class="goatcounter-badge" href="https://{{ . }}.goatcounter.com/" rel="noopener noreferrer" target="_blank" title="Site visit stats" style="display:inline-flex;align-items:center;gap:0.3em;font-size:inherit;line-height:inherit;text-decoration:none;">
        <span aria-hidden="true">🔢</span>
        <span id="goatcounter-count"></span>
      </a>
    </div>
    <span id="goatcounter-raw" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;" aria-hidden="true"></span>
    <script data-goatcounter="https://{{ . }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script>
        var gcInit = setInterval(function () {
            if (window.goatcounter && window.goatcounter.visit_count) {
                clearInterval(gcInit)
                window.goatcounter.visit_count({ append: '#goatcounter-raw' })
                var gcRead = setInterval(function () {
                    var raw = document.getElementById('goatcounter-raw')
                    var match = raw && raw.textContent.match(/[\d,]+/)
                    if (match) {
                        clearInterval(gcRead)
                        document.getElementById('goatcounter-count').textContent = match[0]
                    }
                }, 100)
            }
        }, 100)
    </script>
    {{- end }}
  </div>
</footer>
